name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "cass/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run poe docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # A separate job, so a failed deploy can be re-run without a second upload.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub can take a while to list a new artifact, and deploy-pages looks
      # only once (https://github.com/actions/deploy-pages/issues/451).
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages
        run: |
          for _ in $(seq 24); do
            count=$(gh api "$ARTIFACTS" --jq .total_count) || count=0
            [ "$count" -ge 1 ] && exit 0
            sleep 5
          done
          echo "The github-pages artifact was not listed within two minutes"
          exit 1
      - uses: actions/deploy-pages@v5
        id: deployment
