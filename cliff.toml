# git-cliff configuration — https://git-cliff.org/docs/configuration
# Regenerated by scripts/release.py at release time; also used by
# .github/workflows/release.yml for GitHub Release notes.

[changelog]
header = """# Changelog

All notable changes to cass. Generated by [git-cliff](https://git-cliff.org) from conventional commits.
"""
body = """
{% if version -%}
{% if previous.version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/ejolly/cass/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/ejolly/cass/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif -%}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ejolly/cass/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  # "(#12)" or "(fixes #12)" -> linked issue reference
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/ejolly/cass/issues/${2}))" },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^(chore|style|revert)", group = "<!-- 7 -->Miscellaneous" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

[bump]
# Stay on 0.x: features bump minor, breaking changes bump minor too.
features_always_bump_minor = true
breaking_always_bump_major = false
