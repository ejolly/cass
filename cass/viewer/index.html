<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cass — Database Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33/dist/ag-grid-community.min.js"></script>
  <style>
    :root {
      --sidebar-width: 230px;
      --bg: #fafafa;
      --sidebar-bg: #f0f0f0;
      --sidebar-active: #e0e0e0;
      --sidebar-hover: #e8e8e8;
      --text: #1a1a1a;
      --text-dim: #888;
      --text-faint: #aaa;
      --border: #ddd;
      --accent: #2563eb;
      --accent-light: #dbeafe;
      --success: #16a34a;
      --error: #dc2626;
      --input-bg: #fff;
      --input-border: #ccc;
      --badge-bg: #e5e7eb;
      --badge-text: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --sidebar-bg: #222;
        --sidebar-active: #333;
        --sidebar-hover: #2a2a2a;
        --text: #e5e5e5;
        --text-dim: #777;
        --text-faint: #555;
        --border: #333;
        --accent: #60a5fa;
        --accent-light: #1e3a5f;
        --success: #4ade80;
        --error: #f87171;
        --input-bg: #2a2a2a;
        --input-border: #444;
        --badge-bg: #374151;
        --badge-text: #9ca3af;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────── */

    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: width 0.2s ease, min-width 0.2s ease, opacity 0.2s ease;
    }

    #sidebar.collapsed {
      width: 0;
      min-width: 0;
      overflow: hidden;
      border-right: none;
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .collapse-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .collapse-btn:hover {
      background: var(--sidebar-active);
      color: var(--text);
    }

    #sidebar-toggle {
      position: absolute;
      top: 10px;
      left: 8px;
      z-index: 10;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    #sidebar-toggle:hover {
      background: var(--sidebar-active);
      color: var(--text);
    }

    #sidebar.collapsed ~ #main #sidebar-toggle {
      display: flex;
    }

    .section-group {
      padding-bottom: 4px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      padding: 14px 16px 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      user-select: none;
    }

    .table-item {
      padding: 7px 16px;
      cursor: pointer;
      font-size: 13px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .table-item:hover { background: var(--sidebar-hover); }
    .table-item.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── Main area ────────────────────────────────────── */

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #toolbar {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      min-height: 44px;
      flex-wrap: wrap;
    }

    #table-name {
      font-weight: 600;
      font-size: 14px;
    }

    #table-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    #table-badge.editable {
      background: #dcfce7;
      color: #166534;
    }

    #table-badge.readonly {
      background: var(--badge-bg);
      color: var(--badge-text);
    }

    @media (prefers-color-scheme: dark) {
      #table-badge.editable {
        background: #14532d;
        color: #86efac;
      }
    }

    #table-info {
      font-size: 12px;
      color: var(--text-dim);
    }

    .toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #search-box {
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      width: 200px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #search-box::placeholder { color: var(--text-faint); }

    #search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light);
    }

    .toolbar-btn {
      font-size: 12px;
      padding: 5px 10px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .toolbar-btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    #status {
      font-size: 12px;
      transition: opacity 0.3s;
    }

    #status.success { color: var(--success); }
    #status.error { color: var(--error); }

    #grid-container {
      flex: 1;
      overflow: hidden;
    }

    /* AG Grid theme overrides */
    .ag-theme-alpine, .ag-theme-alpine-dark {
      --ag-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ag-font-size: 13px;
      --ag-row-height: 32px;
      --ag-header-height: 36px;
    }

    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 14px;
      gap: 8px;
    }

    #empty-state .hint {
      font-size: 12px;
      color: var(--text-faint);
    }

    kbd {
      font-size: 11px;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--sidebar-bg);
      font-family: inherit;
    }
  </style>
</head>
<body>
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>cass</h1>
      <button type="button" class="collapse-btn" id="collapse-btn" title="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M10 3L5 8L10 13"/>
        </svg>
      </button>
    </div>
    <div id="table-list"></div>
  </nav>
  <div id="main">
    <button type="button" id="sidebar-toggle" title="Show sidebar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M6 3L11 8L6 13"/>
      </svg>
    </button>
    <div id="toolbar">
      <span id="table-name"></span>
      <span id="table-badge"></span>
      <span id="table-info"></span>
      <div class="toolbar-right">
        <input id="search-box" type="text" placeholder="Search rows..." disabled>
        <button type="button" class="toolbar-btn" id="export-btn" disabled title="Download as CSV">Export CSV</button>
        <span id="status"></span>
      </div>
    </div>
    <div id="grid-container">
      <div id="empty-state">
        <div>Select a table from the sidebar</div>
        <div class="hint">Use <kbd>Ctrl</kbd>+<kbd>K</kbd> to search within a table</div>
      </div>
    </div>
  </div>

  <script>
    const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const gridTheme = isDark ? "ag-theme-alpine-dark" : "ag-theme-alpine";
    const isMac = navigator.platform.toUpperCase().includes("MAC");

    let gridApi = null;
    let currentTable = null;
    let currentSchema = null;
    const combinedTables = new Set();

    // ── Sidebar toggle ────────────────────────────────────

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const toggle = document.getElementById("sidebar-toggle");
      sidebar.classList.toggle("collapsed");
      toggle.style.display = sidebar.classList.contains("collapsed") ? "flex" : "none";
    }

    document.getElementById("collapse-btn").addEventListener("click", toggleSidebar);
    document.getElementById("sidebar-toggle").addEventListener("click", toggleSidebar);

    // ── Sidebar ───────────────────────────────────────────

    function categorize(tables) {
      const groups = {
        canvas: { label: "Canvas LMS", items: [] },
        github: { label: "GitHub Classroom", items: [] },
        master: { label: "Combined Data", items: [] },
      };

      for (const t of tables) {
        if (t.name.startsWith("gh_")) {
          groups.github.items.push(t);
        } else if (t.name.startsWith("canvas_")) {
          groups.canvas.items.push(t);
        } else {
          groups.master.items.push(t);
        }
      }
      return groups;
    }

    async function loadTables() {
      const res = await fetch("/api/tables");
      const data = await res.json();
      const groups = categorize(data.tables);

      const listEl = document.getElementById("table-list");
      listEl.innerHTML = "";

      let firstTable = null;

      // Track combined tables for read-only enforcement
      combinedTables.clear();
      for (const t of groups.master.items) {
        combinedTables.add(t.name);
      }

      for (const [, group] of Object.entries(groups)) {
        if (!group.items.length) continue;

        const section = document.createElement("div");
        section.className = "section-group";

        const label = document.createElement("div");
        label.className = "section-label";
        label.textContent = group.label;
        section.appendChild(label);

        for (const t of group.items) {
          section.appendChild(makeTableItem(t));
          if (!firstTable) firstTable = t.name;
        }

        listEl.appendChild(section);
      }

      if (firstTable) selectTable(firstTable);
    }

    function makeTableItem(t) {
      const el = document.createElement("div");
      el.className = "table-item";
      el.dataset.name = t.name;

      const nameSpan = document.createElement("span");
      nameSpan.textContent = t.name;
      el.appendChild(nameSpan);

      el.addEventListener("click", () => selectTable(t.name));
      return el;
    }

    function setActiveItem(name) {
      document.querySelectorAll(".table-item").forEach(el => {
        el.classList.toggle("active", el.dataset.name === name);
      });
    }

    // ── Search ────────────────────────────────────────────

    const searchBox = document.getElementById("search-box");

    searchBox.addEventListener("input", () => {
      if (!gridApi) return;
      gridApi.setGridOption("quickFilterText", searchBox.value);
      updateRowCount();
    });

    // Keyboard shortcut: Ctrl+K / Cmd+K to focus search
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        searchBox.focus();
        searchBox.select();
      }
      // Escape to blur search
      if (e.key === "Escape" && document.activeElement === searchBox) {
        searchBox.blur();
      }
    });

    // ── Grid ──────────────────────────────────────────────

    function updateRowCount() {
      const infoEl = document.getElementById("table-info");
      if (!gridApi) return;

      let displayed = 0;
      gridApi.forEachNodeAfterFilter(() => { displayed++; });
      const total = gridApi.getDisplayedRowCount !== undefined
        ? (() => { let t = 0; gridApi.forEachNode(() => { t++; }); return t; })()
        : displayed;

      const colCount = gridApi.getColumnDefs().length;
      const filterText = searchBox.value ? ` (${displayed} matching)` : "";
      infoEl.textContent = `${total} rows · ${colCount} columns${filterText}`;
    }

    async function selectTable(name) {
      currentTable = name;
      setActiveItem(name);

      // Reset search
      searchBox.value = "";
      searchBox.disabled = false;
      document.getElementById("export-btn").disabled = false;

      const [schemaRes, dataRes] = await Promise.all([
        fetch(`/api/schema/${name}`),
        fetch(`/api/table/${name}`)
      ]);
      const schema = await schemaRes.json();
      const tableData = await dataRes.json();
      currentSchema = schema;

      // Toolbar info
      document.getElementById("table-name").textContent = name;

      const isCombined = combinedTables.has(name);
      const editable = schema.editable && !isCombined;

      const badge = document.getElementById("table-badge");
      if (editable) {
        badge.textContent = "editable";
        badge.className = "editable";
        badge.title = "Double-click a cell to edit";
      } else {
        badge.textContent = "read-only";
        badge.className = "readonly";
        badge.title = isCombined
          ? "Populated by cass pull — edit source tables instead"
          : "This table has no primary key and cannot be edited";
      }
      badge.id = "table-badge";

      setStatus("");

      const columnDefs = tableData.columns.map((col, i) => {
        const isPK = schema.primary_keys.includes(col);
        const colType = tableData.types[i];
        const def = {
          field: col,
          headerName: col,
          sortable: true,
          filter: true,
          resizable: true,
          editable: editable && !isPK,
          minWidth: 80,
        };

        if (isPK) {
          def.cellStyle = { fontWeight: "500", color: "var(--text-dim)" };
          def.headerName = `${col} (PK)`;
        }

        if (colType?.includes("INT")) {
          def.cellEditor = "agNumberCellEditor";
          def.cellEditorParams = { allowDecimals: false };
          def.filter = "agNumberColumnFilter";
        } else if (colType?.includes("DOUBLE") || colType?.includes("FLOAT")) {
          def.cellEditor = "agNumberCellEditor";
          def.filter = "agNumberColumnFilter";
        } else if (colType === "BOOLEAN") {
          def.cellRenderer = (params) => {
            if (params.value === null || params.value === undefined) return "";
            return params.value ? "Yes" : "No";
          };
          def.cellEditor = "agCheckboxCellEditor";
        }

        return def;
      });

      const rowData = tableData.rows.map(row => {
        const obj = {};
        tableData.columns.forEach((col, i) => { obj[col] = row[i]; });
        return obj;
      });

      // Destroy existing grid
      const container = document.getElementById("grid-container");
      container.innerHTML = "";
      const gridDiv = document.createElement("div");
      gridDiv.className = gridTheme;
      gridDiv.style.height = "100%";
      gridDiv.style.width = "100%";
      container.appendChild(gridDiv);

      gridApi = agGrid.createGrid(gridDiv, {
        columnDefs,
        rowData,
        defaultColDef: {
          sortable: true,
          resizable: true,
        },
        animateRows: false,
        singleClickEdit: false,
        stopEditingWhenCellsLoseFocus: true,
        onCellValueChanged: handleCellEdit,
        onFirstDataRendered: (params) => {
          params.api.autoSizeAllColumns();
        },
        onFilterChanged: () => { updateRowCount(); },
      });

      updateRowCount();
    }

    // ── Cell editing ──────────────────────────────────────

    async function handleCellEdit(event) {
      if (!currentSchema || !currentSchema.editable) return;

      const pk = {};
      currentSchema.primary_keys.forEach(col => {
        pk[col] = event.data[col];
      });

      const body = {
        pk,
        column: event.colDef.field,
        value: event.newValue,
      };

      try {
        const res = await fetch(`/api/update/${currentTable}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await res.json();

        if (result.ok) {
          setStatus("Saved", "success");
          flashCell(event);
        } else {
          setStatus(result.error || "Update failed", "error");
          flashCell(event);
          event.data[event.colDef.field] = event.oldValue;
          event.api.refreshCells({
            rowNodes: [event.node],
            columns: [event.colDef.field],
          });
        }
      } catch (err) {
        setStatus("Network error", "error");
        flashCell(event);
        event.data[event.colDef.field] = event.oldValue;
        event.api.refreshCells({
          rowNodes: [event.node],
          columns: [event.colDef.field],
        });
      }
    }

    function flashCell(event) {
      event.api.flashCells({
        rowNodes: [event.node],
        columns: [event.colDef.field],
        flashDuration: 300,
        fadeDuration: 200,
      });
    }

    // ── Export CSV ─────────────────────────────────────────

    function exportCSV() {
      if (!gridApi || !currentTable) return;
      gridApi.exportDataAsCsv({
        fileName: `${currentTable}.csv`,
      });
    }

    document.getElementById("export-btn").addEventListener("click", exportCSV);

    // ── Status bar ────────────────────────────────────────

    function setStatus(message, type) {
      const el = document.getElementById("status");
      el.textContent = message;
      el.className = type || "";
      if (message) {
        setTimeout(() => {
          if (el.textContent === message) {
            el.style.opacity = "0";
            setTimeout(() => {
              el.textContent = "";
              el.style.opacity = "1";
            }, 300);
          }
        }, 3000);
      }
    }

    // ── Init ──────────────────────────────────────────────

    // Update keyboard hint based on platform
    if (isMac) {
      const hint = document.querySelector("#empty-state .hint");
      if (hint) hint.innerHTML = 'Use <kbd>&#8984;</kbd>+<kbd>K</kbd> to search within a table';
    }

    loadTables().catch(err => {
      document.getElementById("empty-state").innerHTML =
        `Failed to load tables: ${err.message}`;
    });
  </script>
</body>
</html>
