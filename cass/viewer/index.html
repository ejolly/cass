<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cass — Database Viewer</title>
  <style>
    /* Reset — elm-ui handles all layout, but we need a clean base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; overflow: hidden; }

    /*
     * elm-advanced-grid overrides
     *
     * The grid renders its own HTML with elm-css inline styles,
     * so we need !important to theme it. This is the one place
     * where we can't avoid CSS — the grid library owns its DOM.
     *
     * Everything else (sidebar, toolbar, layout) is pure elm-ui
     * with no CSS needed.
     */

    /* ── Light mode grid overrides ─────────────── */

    /* Header bar */
    #_header_-_container_ {
      background-color: #f0f0f0 !important;
      border-bottom: 1px solid #ddd;
    }

    /* Column headers */
    #_header_-_container_ > div {
      background-image: none !important;
      background-color: #f0f0f0 !important;
      border-color: #ddd !important;
      color: #1a1a1a !important;
    }

    /* Header text */
    #_header_-_container_ span {
      color: #1a1a1a !important;
      font-weight: 600;
      font-size: 12px;
    }

    /* Sort arrows */
    #_header_-_container_ svg {
      fill: #888 !important;
    }

    /* Hide per-column filter inputs (grid library always renders them) */
    [data-testid^="filter-"] {
      display: none !important;
    }

    /* Data cells */
    [data-testid="row"] > div {
      border-color: #ddd !important;
      color: #1a1a1a;
      font-size: 13px;
    }

    /* Alternating rows */
    [data-testid="row"]:nth-child(even) {
      background-color: #f5f5f5;
    }

    /* Drag / resize handles */
    [data-testid^="dragHandle-"] div div {
      background-color: #aaa !important;
    }

    [data-testid^="dragHandle-"] ~ div div {
      background-color: #aaa !important;
    }

    /* Unpublished assignments — dimmed row */
    .unpublished-row {
      opacity: 0.45;
    }

    /* ── Dark mode grid overrides ──────────────── */

    @media (prefers-color-scheme: dark) {
      #_header_-_container_ {
        background-color: #222 !important;
        border-bottom: 1px solid #333;
      }

      #_header_-_container_ > div {
        background-image: none !important;
        background-color: #222 !important;
        border-color: #333 !important;
        color: #e5e5e5 !important;
      }

      #_header_-_container_ span {
        color: #e5e5e5 !important;
      }

      #_header_-_container_ svg {
        fill: #777 !important;
      }

      [data-testid="row"] > div {
        border-color: #333 !important;
        color: #e5e5e5;
      }

      [data-testid="row"]:nth-child(even) {
        background-color: #222;
      }

      [data-testid^="dragHandle-"] div div {
        background-color: #555 !important;
      }

      [data-testid^="dragHandle-"] ~ div div {
        background-color: #555 !important;
      }
    }
  </style>
</head>
<body>
  <div id="elm-app"></div>
  <script src="/elm.js"></script>
  <script>
    var isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var app = Elm.Main.init({
      node: document.getElementById("elm-app"),
      flags: {
        darkMode: isDark,
        width: window.innerWidth,
        height: window.innerHeight
      }
    });

    // Port: CSV file download
    app.ports.downloadCsv.subscribe((data) => {
      const blob = new Blob([data.content], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = data.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Port: Cell double-click detection
    // Walks the DOM to find column ID and row values, sends to Elm.
    document.addEventListener("dblclick", (e) => {
      // Find the clicked cell within a grid row
      const row = e.target.closest('[data-testid="row"]');
      if (!row) return;

      // Get all header cells to map column index → column ID
      const headerContainer = document.getElementById("_header_-_container_");
      if (!headerContainer) return;

      const headerCells = headerContainer.querySelectorAll(":scope > div");
      const dataCells = row.querySelectorAll(":scope > div");

      // Find which cell was clicked
      const clickedCell = e.target.closest('[data-testid="row"] > div');
      if (!clickedCell) return;

      const cellIndex = Array.from(dataCells).indexOf(clickedCell);
      if (cellIndex < 0 || cellIndex >= headerCells.length) return;

      // Extract column ID from header (strip " (PK)" suffix if present)
      const headerText = headerCells[cellIndex].textContent.trim().split("\n")[0].trim();
      const columnId = headerText.replace(/ \(PK\)$/, "");

      // Build rowValues: { columnName: cellValue } for all columns
      const rowValues = {};
      headerCells.forEach((hCell, i) => {
        if (i < dataCells.length) {
          const colName = hCell.textContent.trim().split("\n")[0].trim().replace(/ \(PK\)$/, "");
          rowValues[colName] = dataCells[i].textContent.trim();
        }
      });

      app.ports.cellClicked.send({ columnId: columnId, rowValues: rowValues });
    });
  </script>
</body>
</html>
