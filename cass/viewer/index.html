<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cass — Database Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33/dist/ag-grid-community.min.js"></script>
  <style>
    :root {
      --sidebar-width: 220px;
      --bg: #fafafa;
      --sidebar-bg: #f0f0f0;
      --sidebar-active: #e0e0e0;
      --text: #1a1a1a;
      --text-dim: #888;
      --border: #ddd;
      --accent: #2563eb;
      --success: #16a34a;
      --error: #dc2626;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --sidebar-bg: #222;
        --sidebar-active: #333;
        --text: #e5e5e5;
        --text-dim: #777;
        --border: #333;
        --accent: #60a5fa;
        --success: #4ade80;
        --error: #f87171;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #sidebar h1 {
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    #sidebar .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      padding: 12px 16px 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #sidebar .table-item {
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      transition: background 0.1s;
    }

    #sidebar .table-item:hover { background: var(--sidebar-active); }
    #sidebar .table-item.active {
      background: var(--accent);
      color: #fff;
    }

    #sidebar .table-item .view-badge {
      font-size: 10px;
      color: var(--text-dim);
      font-style: italic;
      margin-left: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #sidebar .table-item.active .view-badge { color: rgba(255,255,255,0.7); }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      min-height: 44px;
    }

    #table-name {
      font-weight: 600;
      font-size: 14px;
    }

    #table-info {
      font-size: 12px;
      color: var(--text-dim);
    }

    #status {
      margin-left: auto;
      font-size: 12px;
      transition: opacity 0.3s;
    }

    #status.success { color: var(--success); }
    #status.error { color: var(--error); }

    #grid-container {
      flex: 1;
      overflow: hidden;
    }

    /* AG Grid theme overrides */
    .ag-theme-alpine, .ag-theme-alpine-dark {
      --ag-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ag-font-size: 13px;
      --ag-row-height: 32px;
      --ag-header-height: 36px;
    }

    #empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <nav id="sidebar">
    <h1>cass</h1>
    <div id="table-list"></div>
  </nav>
  <div id="main">
    <div id="toolbar">
      <span id="table-name"></span>
      <span id="table-info"></span>
      <span id="status"></span>
    </div>
    <div id="grid-container">
      <div id="empty-state">Select a table from the sidebar</div>
    </div>
  </div>

  <script>
    const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const gridTheme = isDark ? "ag-theme-alpine-dark" : "ag-theme-alpine";

    let gridApi = null;
    let currentTable = null;
    let currentSchema = null;

    // ── Sidebar ──────────────────────────────────────────────

    async function loadTables() {
      const res = await fetch("/api/tables");
      const data = await res.json();

      const listEl = document.getElementById("table-list");
      listEl.innerHTML = "";

      const tables = data.tables.filter(t => t.type === "table");
      const views = data.tables.filter(t => t.type === "view");

      if (tables.length) {
        const label = document.createElement("div");
        label.className = "section-label";
        label.textContent = "Tables";
        listEl.appendChild(label);
        tables.forEach(t => listEl.appendChild(makeTableItem(t)));
      }

      if (views.length) {
        const label = document.createElement("div");
        label.className = "section-label";
        label.textContent = "Views";
        listEl.appendChild(label);
        views.forEach(t => listEl.appendChild(makeTableItem(t)));
      }

      // Auto-select first table
      if (tables.length) selectTable(tables[0].name);
      else if (views.length) selectTable(views[0].name);
    }

    function makeTableItem(t) {
      const el = document.createElement("div");
      el.className = "table-item";
      el.dataset.name = t.name;
      el.innerHTML = t.name + (t.type === "view"
        ? ' <span class="view-badge">(view)</span>' : "");
      el.addEventListener("click", () => selectTable(t.name));
      return el;
    }

    function setActiveItem(name) {
      document.querySelectorAll(".table-item").forEach(el => {
        el.classList.toggle("active", el.dataset.name === name);
      });
    }

    // ── Grid ─────────────────────────────────────────────────

    async function selectTable(name) {
      currentTable = name;
      setActiveItem(name);

      const [schemaRes, dataRes] = await Promise.all([
        fetch(`/api/schema/${name}`),
        fetch(`/api/table/${name}`)
      ]);
      const schema = await schemaRes.json();
      const tableData = await dataRes.json();
      currentSchema = schema;

      document.getElementById("table-name").textContent = name;
      const rowCount = tableData.rows.length;
      const colCount = tableData.columns.length;
      const editLabel = schema.editable ? "editable" : "read-only";
      document.getElementById("table-info").textContent =
        `${rowCount} rows · ${colCount} columns · ${editLabel}`;
      setStatus("");

      const columnDefs = tableData.columns.map((col, i) => {
        const isPK = schema.primary_keys.includes(col);
        const colType = tableData.types[i];
        const def = {
          field: col,
          headerName: col,
          sortable: true,
          filter: true,
          resizable: true,
          editable: schema.editable && !isPK,
          minWidth: 80,
        };

        // Style PK columns
        if (isPK) {
          def.cellStyle = { fontWeight: "500", color: "var(--text-dim)" };
          def.headerName = col + " 🔑";
        }

        // Type-aware cell editors and formatting
        if (colType && colType.includes("INT")) {
          def.cellEditor = "agNumberCellEditor";
          def.cellEditorParams = { allowDecimals: false };
          def.filter = "agNumberColumnFilter";
        } else if (colType && (colType.includes("DOUBLE") || colType.includes("FLOAT"))) {
          def.cellEditor = "agNumberCellEditor";
          def.filter = "agNumberColumnFilter";
        } else if (colType === "BOOLEAN") {
          def.cellRenderer = (params) => {
            if (params.value === null || params.value === undefined) return "";
            return params.value ? "✓" : "✗";
          };
          def.cellEditor = "agCheckboxCellEditor";
        }

        return def;
      });

      // Convert rows (arrays) to objects keyed by column name
      const rowData = tableData.rows.map(row => {
        const obj = {};
        tableData.columns.forEach((col, i) => { obj[col] = row[i]; });
        return obj;
      });

      // Destroy existing grid
      const container = document.getElementById("grid-container");
      container.innerHTML = "";
      const gridDiv = document.createElement("div");
      gridDiv.className = gridTheme;
      gridDiv.style.height = "100%";
      gridDiv.style.width = "100%";
      container.appendChild(gridDiv);

      gridApi = agGrid.createGrid(gridDiv, {
        columnDefs,
        rowData,
        defaultColDef: {
          sortable: true,
          resizable: true,
        },
        animateRows: false,
        singleClickEdit: false,
        stopEditingWhenCellsLoseFocus: true,
        onCellValueChanged: handleCellEdit,
      });
    }

    // ── Cell editing ─────────────────────────────────────────

    async function handleCellEdit(event) {
      if (!currentSchema || !currentSchema.editable) return;

      const pk = {};
      currentSchema.primary_keys.forEach(col => {
        pk[col] = event.data[col];
      });

      const body = {
        pk,
        column: event.colDef.field,
        value: event.newValue,
      };

      try {
        const res = await fetch(`/api/update/${currentTable}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await res.json();

        if (result.ok) {
          setStatus("Saved", "success");
          flashCell(event, "success");
        } else {
          setStatus(result.error || "Update failed", "error");
          flashCell(event, "error");
          // Revert
          event.data[event.colDef.field] = event.oldValue;
          event.api.refreshCells({
            rowNodes: [event.node],
            columns: [event.colDef.field],
          });
        }
      } catch (err) {
        setStatus("Network error", "error");
        flashCell(event, "error");
        event.data[event.colDef.field] = event.oldValue;
        event.api.refreshCells({
          rowNodes: [event.node],
          columns: [event.colDef.field],
        });
      }
    }

    function flashCell(event, type) {
      event.api.flashCells({
        rowNodes: [event.node],
        columns: [event.colDef.field],
        flashDuration: 300,
        fadeDuration: 200,
      });
    }

    // ── Status bar ───────────────────────────────────────────

    function setStatus(message, type) {
      const el = document.getElementById("status");
      el.textContent = message;
      el.className = type || "";
      if (message) {
        setTimeout(() => {
          if (el.textContent === message) {
            el.style.opacity = "0";
            setTimeout(() => {
              el.textContent = "";
              el.style.opacity = "1";
            }, 300);
          }
        }, 3000);
      }
    }

    // ── Init ─────────────────────────────────────────────────

    loadTables().catch(err => {
      document.getElementById("empty-state").textContent =
        "Failed to load tables: " + err.message;
    });
  </script>
</body>
</html>
