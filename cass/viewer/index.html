<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cass — Database Viewer</title>
  <style>
    /* Reset — elm-ui handles all layout, but we need a clean base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; overflow: hidden; }

    /*
     * elm-advanced-grid overrides
     *
     * The grid renders its own HTML with elm-css inline styles,
     * so we need !important to theme it. This is the one place
     * where we can't avoid CSS — the grid library owns its DOM.
     *
     * Everything else (sidebar, toolbar, layout) is pure elm-ui
     * with no CSS needed.
     */

    /* Header bar */
    #_header_-_container_ {
      background-color: #f0f0f0 !important;
      border-bottom: 1px solid #ddd;
    }

    /* Column headers */
    #_header_-_container_ > div {
      background-image: none !important;
      background-color: #f0f0f0 !important;
      border-color: #ddd !important;
      color: #1a1a1a !important;
    }

    /* Header text */
    #_header_-_container_ span {
      color: #1a1a1a !important;
      font-weight: 600;
      font-size: 12px;
    }

    /* Sort arrows */
    #_header_-_container_ svg {
      fill: #888 !important;
    }

    /* Filter inputs */
    #_header_-_container_ input {
      background-color: #fff !important;
      color: #1a1a1a !important;
      border: 1px solid #ccc !important;
      border-radius: 3px;
      padding: 2px 4px;
      font-size: 12px;
    }

    #_header_-_container_ input:focus {
      border-color: #2563eb !important;
      outline: none;
    }

    /* Data cells */
    [data-testid="row"] > div {
      border-color: #ddd !important;
      color: #1a1a1a;
      font-size: 13px;
    }

    /* Alternating rows */
    [data-testid="row"]:nth-child(even) {
      background-color: #f5f5f5;
    }

    /* Drag / resize handles */
    [data-testid^="dragHandle-"] div div {
      background-color: #aaa !important;
    }

    [data-testid^="dragHandle-"] ~ div div {
      background-color: #aaa !important;
    }

    /* Unpublished assignments — dimmed row */
    .unpublished-row {
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <div id="elm-app"></div>
  <script src="/elm.js"></script>
  <script>
    var app = Elm.Main.init({ node: document.getElementById("elm-app") });

    // Port: CSV file download
    app.ports.downloadCsv.subscribe((data) => {
      const blob = new Blob([data.content], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = data.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
