[project]
name = "cass"
version = "0.2.0"
description = "Grading toolkit for GitHub Classroom and Canvas LMS — native app and CLI"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Eshin Jolly", email = "eshin.jolly@gmail.com" },
]
keywords = ["github-classroom", "canvas", "grading", "education", "nicegui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "typer>=0.24.1",
    "rich>=14.3.3",
    "duckdb>=1.4.4",
    "msgspec>=0.20.0",
    "httpx>=0.28.1",
    "pytz>=2024.1",
    "nicegui>=3.8.0",
    "pywebview>=5.0",
]

[project.urls]
Homepage = "https://github.com/ejolly/cass"
Repository = "https://github.com/ejolly/cass"
Documentation = "https://ejolly.github.io/cass"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.20",
    "pytest>=9.0.2",
    "poethepoet>=0.42.1",
    "pdoc>=15.0",
    "basedpyright>=1.38.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pyinstaller>=6.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cass"]

[project.scripts]
cass-cli = "cass.cli:app"

[project.gui-scripts]
cass = "cass.__main__:main"

[tool.poe.tasks.lint]
help = "Format, lint, and type check"
sequence = [
    { cmd = "ruff format cass/ tests/" },
    { cmd = "ruff check cass/ tests/" },
    { cmd = "ty check" },
    { cmd = "basedpyright cass/" },
]

[tool.poe.tasks.test]
help = "Run test suite"
cmd = "pytest tests/ -v"

[tool.poe.tasks.docs]
help = "Generate API docs to docs/api/"
cmd = "pdoc cass/ --docformat google -o docs/api/"

[tool.poe.tasks.docs-serve]
help = "Live-preview API docs"
cmd = "pdoc cass/ --docformat google"


[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (common pitfalls)
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "TCH",  # flake8-type-checking (TYPE_CHECKING guards)
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie (misc. lints)
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "FURB", # refurb (modern Python idioms)
]
ignore = [
    "RET504",  # unnecessary assignment before return (often clearer with name)
    "UP015",   # redundant open mode (explicit "r" is fine)
    "TCH",     # TYPE_CHECKING guards — msgspec Structs need runtime type access
    "SIM105",  # contextlib.suppress — try/except/pass is often clearer
    "RSE102",  # unnecessary parens on raise — raise typer.Exit() is idiomatic Typer
    "PT006",   # parametrize tuple — "a, b" vs ("a", "b") is a style choice
]

[tool.ruff.lint.isort]
known-first-party = ["cass"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p nicegui.testing.user_plugin -n auto --dist worksteal"
main_file = ""

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.poe.tasks.install]
help = "Install cass as a global CLI tool"
cmd = "uv tool install . --force --reinstall"

[tool.poe.tasks.pack]
help = "Package cass as a standalone native app"
cmd = "nicegui-pack --onefile --windowed --name cass --add-data cass/viewer/styles.css:cass/viewer cass/__main__.py"
