[project]
name = "cass"
version = "0.2.0"
description = "CLI grading toolkit for GitHub Classroom and Canvas LMS — track submissions, deadlines, and sync grades"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Eshin Jolly", email = "eshin.jolly@gmail.com" },
]
keywords = ["github-classroom", "canvas", "grading", "education", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "typer>=0.24.1",
    "rich>=14.3.3",
    "duckdb>=1.4.4",
    "msgspec>=0.20.0",
    "httpx>=0.28.1",
    "pytz>=2024.1",
]

[project.urls]
Homepage = "https://github.com/ejolly/cass"
Repository = "https://github.com/ejolly/cass"
Documentation = "https://ejolly.github.io/cass"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.20",
    "pytest>=9.0.2",
    "poethepoet>=0.42.1",
    "pdoc>=15.0",
    "basedpyright>=1.38.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cass"]
exclude = ["cass/viewer/elm/", "cass/viewer/ui/"]

[project.scripts]
cass = "cass.cli:app"

[tool.poe.tasks.lint]
help = "Format, lint, and type check (Python + viewer)"
sequence = [
    { cmd = "ruff format cass/ tests/" },
    { cmd = "ruff check cass/ tests/" },
    { cmd = "ty check" },
    { cmd = "basedpyright cass/" },
    { shell = "npx --yes @biomejs/biome check --files-ignore-unknown=true cass/viewer/index_classic.html" },
    { shell = "cd cass/viewer/ui && bun run check" },
]

[tool.poe.tasks.test]
help = "Run test suite"
cmd = "pytest tests/ -v"

[tool.poe.tasks.docs]
help = "Generate API docs to docs/api/"
cmd = "pdoc cass/ --docformat google -o docs/api/"

[tool.poe.tasks.docs-serve]
help = "Live-preview API docs"
cmd = "pdoc cass/ --docformat google"

[tool.poe.tasks.ui-build]
help = "Build the Svelte viewer frontend"
sequence = [
    { shell = "cd cass/viewer/ui && bun run build" },
]

[tool.poe.tasks.ui-test]
help = "Run Svelte viewer tests"
shell = "cd cass/viewer/ui && bun run test"

[tool.poe.tasks.ui-dev]
help = "Start Svelte dev server (with HMR)"
shell = "cd cass/viewer/ui && bun run dev"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (common pitfalls)
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "TCH",  # flake8-type-checking (TYPE_CHECKING guards)
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie (misc. lints)
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "FURB", # refurb (modern Python idioms)
]
ignore = [
    "RET504",  # unnecessary assignment before return (often clearer with name)
    "UP015",   # redundant open mode (explicit "r" is fine)
    "TCH",     # TYPE_CHECKING guards — msgspec Structs need runtime type access
    "SIM105",  # contextlib.suppress — try/except/pass is often clearer
    "RSE102",  # unnecessary parens on raise — raise typer.Exit() is idiomatic Typer
    "PT006",   # parametrize tuple — "a, b" vs ("a", "b") is a style choice
]

[tool.ruff.lint.isort]
known-first-party = ["cass"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.poe.tasks.install]
help = "Build Svelte viewer and install cass as a global CLI tool"
sequence = [
    { ref = "ui-build" },
    { cmd = "uv tool install . --force --reinstall" },
]
